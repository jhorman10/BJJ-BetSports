server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # API proxy to local backend
    # ^~ so regex locations (static assets) can never shadow extension-suffixed API URLs
    location ^~ /api/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static assets (JS, CSS, images, etc.) - serve directly
    location ~ \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|map|json|ttf|eot|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

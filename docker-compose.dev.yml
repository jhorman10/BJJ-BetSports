# Docker Compose local portable
# Uso base: docker compose -f docker-compose.dev.yml up -d
# Pipeline MLOps local: docker compose -f docker-compose.dev.yml --profile mlops run --rm mlops-pipeline

services:
  mongodb:
    image: mongo:6.0
    container_name: bjj-mongo-dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: bjj_betsports
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: bjj-betsports-backend:local
    container_name: bjj-backend-api-dev
    working_dir: /app/backend
    command: ["python", "-m", "uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: "mongodb://admin:adminpassword@mongodb:27017/"
      MONGO_DB_NAME: "bjj_betsports"
      MONGO_ASYNC_MODE: ${MONGO_ASYNC_MODE:-}
      DISABLE_ML_TRAINING: ${DISABLE_ML_TRAINING:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      N_JOBS: ${N_JOBS:-2}
      TRAIN_DAYS: ${TRAIN_DAYS:-550}
      PREDICT_LEAGUES: ${PREDICT_LEAGUES:-E0}
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend:rw

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://backend-api:8000}
    image: bjj-betsports-frontend:local
    container_name: bjj-frontend-dev
    ports:
      - "5173:80"
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped

  ml-worker:
    build:
      context: .
      dockerfile: Dockerfile.ml
    image: bjj-betsports-ml:local
    container_name: bjj-ml-worker-dev
    working_dir: /app/backend
    command: ["python", "src/worker.py"]
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: "mongodb://admin:adminpassword@mongodb:27017/"
      MONGO_DB_NAME: "bjj_betsports"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_MODE: ${WORKER_MODE:-cron}
      WORKER_RUN_IMMEDIATE: ${WORKER_RUN_IMMEDIATE:-false}
    depends_on:
      mongodb:
        condition: service_healthy
    profiles: ["automation"]
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

  mlops-pipeline:
    build:
      context: .
      dockerfile: Dockerfile.ml
    image: bjj-betsports-ml:local
    container_name: bjj-mlops-pipeline-dev
    working_dir: /app/backend
    command: ["bash", "-lc", "./scripts/local_mlops_pipeline.sh"]
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: "mongodb://admin:adminpassword@mongodb:27017/"
      MONGO_DB_NAME: "bjj_betsports"
      N_JOBS: ${N_JOBS:-4}
      TRAIN_DAYS: ${TRAIN_DAYS:-550}
      PREDICT_LEAGUES: ${PREDICT_LEAGUES:-E0,SP1,D1,I1,F1,P1,B1,UCL,COL1,ARG1,BRA1}
      TOP_PICKS_LIMIT: ${TOP_PICKS_LIMIT:-50}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mongodb:
        condition: service_healthy
    profiles: ["mlops"]
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

  labeler:
    build:
      context: .
      dockerfile: Dockerfile.ml
    image: bjj-betsports-ml:local
    container_name: bjj-labeler-dev
    working_dir: /app/backend
    command: ["python", "/app/backend/scripts/labeler_service_safe.py"]
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: "mongodb://admin:adminpassword@mongodb:27017/"
      MONGO_DB_NAME: "bjj_betsports"
      LABELER_INTERVAL_SEC: ${LABELER_INTERVAL_SEC:-600}
      LABELER_SCRIPT_PATH: /app/backend/scripts/label_finished_matches.py
      LABELER_LIMIT: ${LABELER_LIMIT:-200}
      LABELER_RETRIES: ${LABELER_RETRIES:-3}
      LABELER_DRY_RUN: ${LABELER_DRY_RUN:-false}
      LABELER_TIMEOUT_SEC: ${LABELER_TIMEOUT_SEC:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mongodb:
        condition: service_healthy
    profiles: ["automation"]
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

  updater:
    build:
      context: .
      dockerfile: Dockerfile.ml
    image: bjj-betsports-ml:local
    container_name: bjj-updater-dev
    working_dir: /app/backend
    command: ["python", "/app/backend/scripts/updater_service.py"]
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: "mongodb://admin:adminpassword@mongodb:27017/"
      MONGO_DB_NAME: "bjj_betsports"
      UPDATER_INTERVAL_SEC: ${UPDATER_INTERVAL_SEC:-600}
      UPDATER_SCRIPT_PATH: /app/backend/scripts/update_predictions_with_results.py
      UPDATER_DAYS_BACK: ${UPDATER_DAYS_BACK:-3}
      UPDATER_DRY_RUN: ${UPDATER_DRY_RUN:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mongodb:
        condition: service_healthy
    profiles: ["automation"]
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongodb_data:


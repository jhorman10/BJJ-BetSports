[tool.black]
line-length = 88
target-version = ["py311"]
exclude = '''
/(
    \.git
    | \.venv
    | backend/ml_models
    | __pycache__
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
exclude = ["backend/ml_models", ".venv", "dev-dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "C", "N"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"backend/src/application/use_cases/suggested_picks_use_case.py" = ["C901"]
"backend/src/domain/services/ai_picks_service.py" = ["C901"]
"backend/src/domain/services/audit_service.py" = ["C901"]
"backend/src/domain/services/match_aggregator_service.py" = ["C901"]
"backend/src/domain/services/match_enrichment_service.py" = ["C901"]
"backend/src/domain/services/pick_resolution_service.py" = ["C901"]
"backend/src/domain/services/picks_service.py" = ["C901", "E501"]
"backend/src/domain/services/prediction_service.py" = ["C901"]
"backend/src/domain/services/risk_management/risk_manager.py" = ["C901"]
"backend/src/domain/services/statistics_service.py" = ["C901"]
"backend/src/infrastructure/data_sources/espn.py" = ["C901"]
"backend/src/infrastructure/data_sources/football_data_org.py" = ["C901"]
"backend/src/infrastructure/data_sources/football_data_uk.py" = ["C901"]
"backend/src/infrastructure/data_sources/github_dataset.py" = ["C901"]
"backend/src/scheduler.py" = ["C901"]
"backend/tests/**" = ["C901", "N803", "N806", "E402", "E501"]
"backend/src/application/services/ml_evaluation_gate.py" = ["N803", "N806"]
"backend/src/application/services/ml_training_orchestrator.py" = ["N806"]
"backend/src/domain/entities/tennis_match.py" = ["N815"]
"backend/src/domain/services/tennis_feature_extractor.py" = ["N806", "E741"]
"backend/src/api/routers/leagues.py" = ["E741"]
"backend/src/infrastructure/data/league_loader.py" = ["C901", "E501"]
"backend/src/infrastructure/data/verify_dataset.py" = ["E501"]
"backend/src/infrastructure/data_sources/mlb_fixture_source.py" = ["E501"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "skip"
disallow_untyped_defs = false
warn_unused_ignores = false
exclude = [
    "domain/services/continuous_learning.py",
    "infrastructure/odds_feed.py",
    "domain/services/sharp_detector.py",
    "domain/services/tennis_prediction_service.py",
    "domain/entities/tennis_match.py",
    "domain/services/tennis_feature_extractor.py",
    "api/routers/leagues.py",
    "infrastructure/data/league_loader.py",
    "infrastructure/data/verify_dataset.py",
    "infrastructure/data_sources/mlb_fixture_source.py",
    "domain/services/prediction_service.py",
    "infrastructure/data/league_loader.py",
    "domain/services/basketball_prediction_service.py",
    "domain/services/baseball_prediction_service.py",
]